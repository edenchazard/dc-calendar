name: Tests

on: [push]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: create dummy env
        run: touch .env && cat .env.example >> .env

      - name: start test environment
        run: docker compose up app -d

      - name: try to build the project
        run: docker compose exec -T app sh -c "npm run generate"

      - name: run formatting checks
        run: docker compose exec -T app sh -c "npm run fmt:check"

      - name: run linting
        run: docker compose exec -T app sh -c "npm run lint"

      - name: run typescript checks
        run: docker compose exec -T app sh -c "npm run ts:check"

      - name: run vitest
        run: docker compose exec -T app sh -c "npm run test:vitest -- --run"

      - name: run e2e tests
        run: docker compose exec -T -e CI=true app sh -c "npm run test:e2e"
