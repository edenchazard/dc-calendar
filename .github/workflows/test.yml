name: Tests

on: [push]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: create dummy env
        run: touch .env && cat .env.example >> .env

      - name: start test environment
        run: docker compose up testapp -d --build

      - name: try to build the project
        run: docker compose exec -T testapp sh -c "npm run generate"

      - name: run formatting checks
        run: docker compose exec -T testapp sh -c "npm run fmt:check"

      - name: run linting
        run: docker compose exec -T testapp sh -c "npm run lint"

      - name: run typescript checks
        run: docker compose exec -T testapp sh -c "npm run ts:check"

      - name: run vitest:nuxt
        run: docker compose exec -T testapp sh -c "npm run test -- --run --project nuxt"

      - name: run end-to-end tests
        run: docker compose exec -T -e CI=true testapp sh -c "npm run test:e2e"

      - name: stop test environment
        if: always()
        run: docker compose down -v
